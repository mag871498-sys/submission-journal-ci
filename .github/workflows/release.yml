name: Verify submission journal releases
on:
  push:
    tags: ['v*']
    branches: ['exercise/failed-api-check']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Test and export the journal image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test environment
        run: python -m pip install -r requirements-test.txt
      - name: Validate responses and data
        run: |
          mkdir -p diagnostics
          python lab.py test --timeout 45 --junit diagnostics/pytest.xml 2>&1 | tee diagnostics/pytest.log
      - name: Build release image
        run: |
          mkdir -p archive cached
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then tag=branch-check; fi
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "journal-lab:$tag" .
          docker image inspect --format '{{.Id}}' "journal-lab:$tag" > archive/image-id.txt
          printf '%s\n' "$tag" > archive/release.txt
          docker save "journal-lab:$tag" -o image.tar
          gzip -n -1 -c image.tar > archive/image.tar.gz
          (cd archive && sha256sum image.tar.gz) > archive/image.sha256
          base="$(awk 'NR==1 { print $2 }' Dockerfile)"
          docker pull "$base"
          docker save "$base" -o base.tar
          python scripts/cache_archive.py pack base.tar image.tar cached
          cp archive/*.txt archive/image.sha256 cached/
      - name: Upload original release archive
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: image-${{ github.ref_name }}
          path: archive/
          if-no-files-found: error
          compression-level: 0
      - name: Upload cached-layer bundle
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: cached-${{ github.ref_name }}
          path: cached/
          if-no-files-found: error
          compression-level: 0
      - name: Save pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results
          path: diagnostics/
          if-no-files-found: warn
